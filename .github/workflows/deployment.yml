name: Docker Image CI/CD

on:
  push:
    branches: [  "release/**" ] 
  pull_request:
    branches: [  "release/**" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract commit SHA
        run: echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Docker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pipelinepy:${{ env.COMMIT_SHA }}
            ${{ secrets.DOCKERHUB_USERNAME }}/pipelinepy:latest 

      - name: Image details
        if: steps.build-push.outputs.digest
        run: echo "Pushed image ${{ steps.build-push.outputs.digest }}"

      - name: Authenticate to Google Cloud using Service Account Key
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_JSON }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: praegustator-backend
          location: europe-west1
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.27.0'

      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s/deployment.yaml -f k8s/service.yaml

      - name: Update image in deployment
        run: kubectl set image deployment/py-backend-deployment py-backend-container=${{ secrets.DOCKERHUB_USERNAME }}/pipelinepy:${{ env.COMMIT_SHA }}

      - name: Wait for rollout to complete
        run: kubectl rollout status deployment/py-backend-deployment --namespace=default --timeout=5m


